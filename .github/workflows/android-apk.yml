name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee -a /tmp/build.log

      # `capacitor-cordova-android-plugins/` (which Gradle needs) is in
      # android/.gitignore on purpose — Capacitor regenerates it from
      # capacitor.config.ts + node_modules on every sync rather than having
      # it hand-committed, the same way you wouldn't commit node_modules.
      # Skipping this step is what "Could not read script
      # .../cordova.variables.gradle as it does not exist" actually meant.
      - name: Sync Capacitor Android project
        shell: bash
        run: |
          set -o pipefail
          npx cap sync android 2>&1 | tee -a /tmp/build.log

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # A release build must be signed with a consistent key across builds —
      # otherwise Android refuses to treat build N+1 as an update to build N,
      # and (more importantly for now) an unsigned/debug-signed APK is flagged
      # by Play Protect as a dev build when regular users try to install it.
      # Generated once and committed back to the repo so every future build
      # reuses the same identity; this is a self-distributed sideload APK,
      # not a Play Store submission, so keeping the key in the (public) repo
      # is an acceptable tradeoff for "anyone can build and it just works".
      - name: Ensure a release signing key exists
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          if [ ! -f release.keystore ]; then
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias chatgiza \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'chatgiza-android-2026' }}" \
              -keypass "${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'chatgiza-android-2026' }}" \
              -dname "CN=ChatGiZa, OU=ChatGiZa, O=ChatGiZa, L=Unknown, ST=Unknown, C=TZ" \
              2>&1 | tee -a /tmp/build.log
            cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'chatgiza-android-2026' }}
          keyAlias=chatgiza
          keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'chatgiza-android-2026' }}
          EOF
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add release.keystore keystore.properties
            git commit -m "ci: generate persistent Android release signing key [skip ci]"
            git push
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses and install the compile SDK platform
        shell: bash
        run: |
          set -o pipefail
          (yes | sdkmanager --licenses > /dev/null || true)
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tee -a /tmp/build.log

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ubuntu-latest runners have ~7GB RAM total; a full Android/Capacitor
      # build (AAPT2, D8/R8, multiple JVM workers) can OOM-kill mid-build
      # even with a conservative Gradle heap — extra swap is cheap insurance
      # when it works. `continue-on-error` because this step has been flaky
      # for reasons not worth blocking the build over — --max-workers=1 and
      # the capped heap/metaspace in gradle.properties are the real fix.
      - name: Add swap space
        continue-on-error: true
        run: |
          sudo dd if=/dev/zero of=/swapfile bs=1M count=6144
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Build signed release APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --max-workers=1 --stacktrace 2>&1 | tee -a /tmp/build.log

      # Job logs require a GitHub login to view, even on a public repo —
      # this surfaces the failure as a check-run annotation instead, which
      # IS readable without auth via the public API, so the actual error is
      # visible without needing repo access. Every step above appends to the
      # same /tmp/build.log, so whichever step failed, its output is here.
      - name: Surface build failure as an annotation
        if: failure()
        shell: bash
        run: |
          set +o pipefail
          if [ -f /tmp/build.log ]; then
            # Gradle's plain-English "what went wrong" summary (if this got
            # that far) comes *before* the huge internal stack trace — prefer
            # that section; otherwise fall back to the last 80 lines of
            # whatever step actually failed.
            section=$(awk '/FAILURE: Build failed|What went wrong/{found=1} found{print; n++} n>=60{exit}' /tmp/build.log)
            if [ -z "$section" ]; then
              section=$(tail -n 80 /tmp/build.log)
            fi
          else
            section="(no log was captured — the failure happened before any logged step)"
          fi
          msg=$(printf '%s' "$section" | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
          echo "::error::$msg"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatgiza-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      # Workflow artifacts require a GitHub login to download. A Release
      # attaches the same APK to a public, direct download URL instead —
      # this repo is public, so the link works for anyone without signing in.
      - name: Publish APK to a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: "ChatGiZa Android build #${{ github.run_number }}"
          body: |
            Signed release build from commit ${{ github.sha }}.
            Loads the live site (chatgiza.com) in a WebView. Enable
            "Install unknown apps" for your browser/file manager to sideload —
            it is not distributed through the Play Store.
          prerelease: true
          files: android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
