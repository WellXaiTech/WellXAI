name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses and install the compile SDK platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-build.log

      # Job logs require a GitHub login to view, even on a public repo —
      # this surfaces the failure as a check-run annotation instead, which
      # IS readable without auth via the public API, so the actual Gradle
      # error is visible without needing repo access.
      - name: Surface build failure as an annotation
        if: failure()
        shell: bash
        run: |
          msg=$(tail -n 80 /tmp/gradle-build.log | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
          echo "::error::$msg"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatgiza-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Workflow artifacts require a GitHub login to download. A Release
      # attaches the same APK to a public, direct download URL instead —
      # this repo is public, so the link works for anyone without signing in.
      - name: Publish APK to a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: "ChatGiZa Android build #${{ github.run_number }}"
          body: |
            Automated debug build from commit ${{ github.sha }}.
            Loads the live site (chatgiza.com) in a WebView — sideload for
            testing only, not a signed release build.
          prerelease: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
