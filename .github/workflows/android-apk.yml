name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses and install the compile SDK platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ubuntu-latest runners have ~7GB RAM total; a full Android/Capacitor
      # build (AAPT2, D8/R8, multiple JVM workers) can OOM-kill mid-build
      # even with a conservative Gradle heap — extra swap is cheap insurance
      # when it works. `continue-on-error` because this step has failed for
      # reasons not visible in the annotation-only diagnostics available here
      # (likely a runner-image quirk, not something worth blocking the build
      # over) — --max-workers=1 and the capped heap/metaspace below are the
      # real fix either way.
      - name: Add swap space
        continue-on-error: true
        run: |
          sudo dd if=/dev/zero of=/swapfile bs=1M count=6144
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --max-workers=1 --stacktrace 2>&1 | tee /tmp/gradle-build.log

      # Job logs require a GitHub login to view, even on a public repo —
      # this surfaces the failure as a check-run annotation instead, which
      # IS readable without auth via the public API, so the actual Gradle
      # error is visible without needing repo access.
      - name: Surface build failure as an annotation
        if: failure()
        shell: bash
        run: |
          set +o pipefail
          # Gradle's plain-English "what went wrong" summary comes *before*
          # the (huge, useless-for-diagnosis) internal stack trace — grab
          # that section specifically instead of just the tail of the log.
          # (awk self-limits to 60 lines instead of piping into `head`,
          # which — combined with the default `pipefail` these steps run
          # under — SIGPIPEs the upstream process the moment `head` closes
          # its input early, failing this diagnostic step itself.)
          if [ -f /tmp/gradle-build.log ]; then
            section=$(awk '/FAILURE: Build failed|What went wrong/{found=1} found{print; n++} n>=60{exit}' /tmp/gradle-build.log)
            if [ -z "$section" ]; then
              section=$(tail -n 80 /tmp/gradle-build.log)
            fi
          else
            section="(a step before the Gradle build itself failed — no build log was produced)"
          fi
          msg=$(printf '%s' "$section" | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
          echo "::error::$msg"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatgiza-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Workflow artifacts require a GitHub login to download. A Release
      # attaches the same APK to a public, direct download URL instead —
      # this repo is public, so the link works for anyone without signing in.
      - name: Publish APK to a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: "ChatGiZa Android build #${{ github.run_number }}"
          body: |
            Automated debug build from commit ${{ github.sha }}.
            Loads the live site (chatgiza.com) in a WebView — sideload for
            testing only, not a signed release build.
          prerelease: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
