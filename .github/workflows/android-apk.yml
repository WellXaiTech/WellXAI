# Re-triggering after rotating to a brand-new signing key (the old one was
# already public in git history, so it's treated as compromised).
name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee -a /tmp/build.log

      # `capacitor-cordova-android-plugins/` (which Gradle needs) is in
      # android/.gitignore on purpose — Capacitor regenerates it from
      # capacitor.config.ts + node_modules on every sync rather than having
      # it hand-committed, the same way you wouldn't commit node_modules.
      # Skipping this step is what "Could not read script
      # .../cordova.variables.gradle as it does not exist" actually meant.
      - name: Sync Capacitor Android project
        shell: bash
        run: |
          set -o pipefail
          npx cap sync android 2>&1 | tee -a /tmp/build.log

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # A release build must be signed with a consistent key across builds —
      # otherwise Android refuses to treat build N+1 as an update to build N.
      # The keystore used to be generated once and committed back to the repo
      # so every build could reuse it -- that leaked the real signing key and
      # its password into (public) git history. It now lives only as repo
      # secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD) and is
      # decoded into a gitignored local file here; nothing signing-related is
      # ever written back to the repo.
      - name: Write the release signing key from secrets
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] || [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD repo secrets are not set -- add them under Settings > Secrets and variables > Actions before this workflow can sign a release build."
            exit 1
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=chatgiza
          keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EOF

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses and install the compile SDK platform
        shell: bash
        run: |
          set -o pipefail
          (yes | sdkmanager --licenses > /dev/null || true)
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tee -a /tmp/build.log

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ubuntu-latest runners have ~7GB RAM total; a full Android/Capacitor
      # build (AAPT2, D8/R8, multiple JVM workers) can OOM-kill mid-build
      # even with a conservative Gradle heap — extra swap is cheap insurance
      # when it works. `continue-on-error` because this step has been flaky
      # for reasons not worth blocking the build over — --max-workers=1 and
      # the capped heap/metaspace in gradle.properties are the real fix.
      - name: Add swap space
        continue-on-error: true
        run: |
          sudo dd if=/dev/zero of=/swapfile bs=1M count=6144
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Build signed release APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --max-workers=1 --stacktrace 2>&1 | tee -a /tmp/build.log

      # Job logs require a GitHub login to view, even on a public repo —
      # this surfaces the failure as a check-run annotation instead, which
      # IS readable without auth via the public API, so the actual error is
      # visible without needing repo access. Every step above appends to the
      # same /tmp/build.log, so whichever step failed, its output is here.
      - name: Surface build failure as an annotation
        if: failure()
        shell: bash
        run: |
          set +o pipefail
          if [ -f /tmp/build.log ]; then
            # kotlinc's own "e: ..." error lines (unresolved reference, type
            # mismatch, etc.) are what's actually wrong and appear *before*
            # Gradle's generic "Compilation error, see log" wrapper — prefer
            # those; then Gradle's "what went wrong" summary; then a tail.
            section=$(grep -A2 "^e: " /tmp/build.log | head -c 4000)
            if [ -z "$section" ]; then
              section=$(awk '/FAILURE: Build failed|What went wrong/{found=1} found{print; n++} n>=60{exit}' /tmp/build.log)
            fi
            if [ -z "$section" ]; then
              section=$(tail -n 80 /tmp/build.log)
            fi
          else
            section="(no log was captured — the failure happened before any logged step)"
          fi
          msg=$(printf '%s' "$section" | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
          echo "::error::$msg"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatgiza-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      # Workflow artifacts require a GitHub login to download. A Release
      # attaches the same APK to a public, direct download URL instead —
      # this repo is public, so the link works for anyone without signing in.
      - name: Publish APK to a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: "ChatGiZa Android build #${{ github.run_number }}"
          body: |
            Signed release build from commit ${{ github.sha }}.
            Loads the live site (chatgiza.com) in a WebView. Enable
            "Install unknown apps" for your browser/file manager to sideload —
            it is not distributed through the Play Store.
          files: android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
