name: Build Desktop App

on:
  push:
    branches: [main]
    paths:
      - "electron-app/**"
      - ".github/workflows/desktop-app.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist-script: dist
            artifact-glob: "release/*.exe"
            artifact-name: chatgiza-windows-installer
          - os: macos-latest
            dist-script: dist:mac
            artifact-glob: "release/*.dmg"
            artifact-name: chatgiza-mac-installer
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: electron-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        shell: bash
        run: npm ci

      # Unsigned build -- there's no Apple Developer / Windows code-signing
      # certificate configured as a repo secret. Windows shows a
      # SmartScreen "unknown publisher" prompt on first run (click "More
      # info" -> "Run anyway"); macOS Gatekeeper blocks it outright until
      # the user right-clicks the app -> Open once, or runs
      # `xattr -cr /Applications/ChatGiZa.app`. Same tradeoff the sideloaded
      # Android APK already has (not distributed through a store that would
      # otherwise vouch for it) -- getting a real cert for either platform
      # is a separate, paid step to add later if it's worth it.
      - name: Build installer
        shell: bash
        run: npm run ${{ matrix.dist-script }}

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: electron-app/${{ matrix.artifact-glob }}

      # Workflow artifacts require a GitHub login to download. A Release
      # attaches the same installer to a public, direct download URL
      # instead -- this repo is public, so the link works for anyone
      # without signing in. Both OS jobs publish to the SAME release tag
      # (one release per run number, two files attached to it).
      - name: Publish installer to a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-build-${{ github.run_number }}
          name: "ChatGiZa Desktop build #${{ github.run_number }}"
          body: |
            Unsigned desktop build from commit ${{ github.sha }}. Loads the
            live site (chatgiza.com) in a chrome-free window.

            - Windows: SmartScreen will warn on first run -- click "More
              info" then "Run anyway".
            - Mac: Gatekeeper will block it on first run -- right-click the
              app and choose "Open" once, or run
              `xattr -cr /Applications/ChatGiZa.app` in Terminal.

            Not distributed through the Microsoft Store or Mac App Store.
          files: electron-app/${{ matrix.artifact-glob }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
